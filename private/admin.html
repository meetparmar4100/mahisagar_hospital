let data,tab='dashboard',dirty=false,busy=false;const $=id=>document.getElementById(id);const el=(tag,text,cls)=>{let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};const btn=(text,fn,cls)=>{let b=el('button',text,cls);b.type='button';b.onclick=fn;return b};const status=(s,bad=false)=>{$('status').textContent=s;$('status').className='status'+(bad?' error':'')};async function api(path,body,method='POST',raw=false){let r=await fetch('/api/admin/'+path,body===undefined?{method:'GET'}:{method,headers:raw?{}:{'Content-Type':'application/json'},body:raw?body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function changed(){dirty=true;status('Unsaved changes')}

function mediaField(parent,title,value,set,sizesOwner,key,isVideo=false,card=false){let box=el('div',undefined,'media-card');box.append(el('strong',title));let preview=mediaPreview(value,isVideo);let customize=()=>modal(title,p=>{p.append(mediaPreview(value,isVideo));field(p,isVideo?'Video URL':'Image URL',value,v=>set(v));let f=el('input');f.type='file';f.accept=isVideo?'video/mp4':'image/jpeg,image/png,image/webp,image/gif';f.onchange=async()=>{let file=f.files[0];if(!file||busy)return;if(file.size>20*1024*1024){status('File exceeds 20 MB',true);return}if(isVideo&&file.type!=='video/mp4'||!isVideo&&!file.type.startsWith('image/')){status('Choose the correct media type.',true);return}try{busy=true;status('Uploading…');let j=await api('upload',file,'POST',true);set(j.url);changed();closeDialog();render()}catch(e){status(e.message,true);let note=el('p',e.message,'error');p.append(note)}finally{busy=false}};p.append(el('p','Upload or paste an HTTPS URL. Maximum upload: 20 MB.','note'),f);if(!isVideo&&sizesOwner)sizeControls(p,sizesOwner,key,card)});if(!isVideo){let click=el('button',undefined,'thumb-button');click.type='button';click.setAttribute('aria-label','Customize '+title);click.onclick=customize;click.append(preview);box.append(click)}else box.append(preview);let actions=el('div',undefined,'media-actions');actions.append(btn(value?'Customize':(isVideo?'+ Add video':'+ Add image'),customize,'ghost mini'));if(value){actions.append(btn(isVideo?'Delete video':'Delete image',()=>{if(confirm('Remove this '+(isVideo?'video':'image')+' from the website?')){set('');changed();render()}},'danger mini'))}box.append(actions);parent.append(box)}
